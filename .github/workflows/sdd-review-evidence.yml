name: SDD Review Evidence Sync

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: sdd-review-evidence-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync-review-evidence:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync SDD review metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REVIEWED_AT: ${{ github.event.pull_request.merged_at }}
          REVIEWED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: node .agents/scripts/sdd/sync-review-metadata.mjs

      - name: Verify SDD review state
        run: |
          node --test .agents/scripts/harness/tests/spec-check.test.mjs
          bash .agents/scripts/harness/checks/spec-check.sh --stage

      - name: Commit review evidence
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet; then
            echo "No review metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: record SDD review evidence for PR #${PR_NUMBER}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
