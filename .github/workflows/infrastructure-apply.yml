name: Infrastructure Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Remote environment to apply
        required: true
        type: choice
        options: [preview, production]
      confirm_environment:
        description: Type the selected environment again
        required: true
        type: string
      allow_destroy:
        description: Explicitly allow delete or replacement changes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      ALLOW_DESTROY: ${{ inputs.allow_destroy }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_project_name: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
      TF_VAR_preview_hostname: ${{ vars.PREVIEW_HOSTNAME }}
      TF_VAR_preview_allowed_emails: ${{ vars.PREVIEW_ALLOWED_EMAILS || '[]' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_R2_BUCKET }}
      TF_STATE_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Confirm target environment
        env:
          CONFIRM_ENVIRONMENT: ${{ inputs.confirm_environment }}
        run: test "$DEPLOY_ENVIRONMENT" = "$CONFIRM_ENVIRONMENT"
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
      - name: Initialize R2 backend
        run: bash infrastructure/scripts/terraform-init-r2.sh
      - name: Back up current state
        run: bash infrastructure/scripts/backup-terraform-state.sh
      - name: Build fresh plan
        run: |
          terraform -chdir=infrastructure/terraform plan -input=false -out=/tmp/cloudflare.tfplan
          terraform -chdir=infrastructure/terraform show -json /tmp/cloudflare.tfplan > /tmp/cloudflare-plan.json
      - name: Reject unapproved destructive changes
        run: node infrastructure/scripts/assert-safe-terraform-plan.mjs /tmp/cloudflare-plan.json
      - name: Apply the saved plan
        run: terraform -chdir=infrastructure/terraform apply -input=false /tmp/cloudflare.tfplan
