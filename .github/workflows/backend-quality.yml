name: Backend Quality

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docs/specs/hono-backend-boilerplate/**"
      - "package.json"
      - "package-lock.json"
      - ".agents/profiles/hono/**"
      - ".agents/harness-engineering/**"
      - ".agents/scripts/**"
      - ".github/workflows/backend-quality.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docs/specs/hono-backend-boilerplate/**"
      - "package.json"
      - "package-lock.json"
      - ".agents/profiles/hono/**"
      - ".agents/harness-engineering/**"
      - ".agents/scripts/**"
      - ".github/workflows/backend-quality.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Harness verify
        run: npm run harness:verify -- --spec-complete
