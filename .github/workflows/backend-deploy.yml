name: Cloudflare Application Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Remote deployment environment
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    concurrency:
      group: application-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_project_name: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_R2_BUCKET }}
      TF_STATE_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
      - name: Install dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build --workspace @dev-standard/frontend
      - name: Initialize existing infrastructure state
        run: bash infrastructure/scripts/terraform-init-r2.sh
      - name: Generate remote Wrangler configuration
        run: |
          D1_DATABASE_ID="$(terraform -chdir=infrastructure/terraform output -raw d1_database_id)"
          D1_DATABASE_NAME="$(terraform -chdir=infrastructure/terraform output -raw d1_database_name)"
          R2_BUCKET_NAME="$(terraform -chdir=infrastructure/terraform output -raw r2_bucket_name)"
          WORKER_NAME="${D1_DATABASE_NAME%-tasks}-worker"
          export D1_DATABASE_ID D1_DATABASE_NAME R2_BUCKET_NAME WORKER_NAME
          if [ "$DEPLOY_ENVIRONMENT" = "preview" ]; then
            PREVIEW_HOSTNAME="$(terraform -chdir=infrastructure/terraform output -raw preview_hostname)"
            PREVIEW_ACCESS_APPLICATION_ID="$(terraform -chdir=infrastructure/terraform output -raw preview_access_application_id)"
            export PREVIEW_HOSTNAME PREVIEW_ACCESS_APPLICATION_ID
          fi
          npm run infrastructure:generate-wrangler -- --output backend/wrangler.remote.jsonc
          echo "D1_DATABASE_NAME=$D1_DATABASE_NAME" >> "$GITHUB_ENV"
      - name: Apply D1 migrations
        working-directory: backend
        run: npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config wrangler.remote.jsonc
      - name: Deploy Worker and SPA assets
        working-directory: backend
        run: npx wrangler deploy --config wrangler.remote.jsonc
